name: oneix

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: oneix
      POSTGRES_PASSWORD: oneix
      POSTGRES_DB: oneix
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
